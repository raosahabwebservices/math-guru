<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ask Doubt | MATHS GURU</title><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><link rel="stylesheet" href="style.css"></head><body><nav class="nav"><div class="nav-inner"><a class="brand" href="index.html">MATHS GURU</a><div class="links"><a href="dashboard.html">Dashboard</a><a href="upgrade.html">Upgrade</a><button class="btn small ghost" data-logout>Logout</button></div></div></nav><main class="container"><h1 class="section-title">Ask a maths doubt</h1><p class="muted">Get bilingual solution with formula explanation.</p><div class="tabs" style="margin:20px 0"><button class="tab active" data-tab="text">Text Doubt</button><button class="tab" data-tab="image">Image Doubt</button></div><section class="grid two"><form id="textDoubtForm" class="card form full"><h3>Type your question</h3><textarea name="question" placeholder="Example: Solve 2x + 5 = 15" required></textarea><button class="btn" type="submit">Solve Text Doubt</button><div id="textMsg" class="hidden"></div></form><form id="imageDoubtForm" class="card form full hidden"><h3>Upload question image</h3><input name="image" type="file" accept="image/*" required><textarea name="question" placeholder="Optional: add context, class or chapter"></textarea><button class="btn" type="submit">Solve Image Doubt</button><div id="imageMsg" class="hidden"></div></form><aside class="card"><h3>Remaining limits</h3><p><strong id="limitText">-</strong> text doubts left</p><p><strong id="limitImage">-</strong> image doubts left</p><a class="btn ghost" href="upgrade.html">Need more? Upgrade</a></aside></section><section id="solutionPanel" class="card hidden" style="margin-top:28px"><h2 class="section-title">AI Solution</h2><div id="solutionContent" class="solution"></div></section></main><script src="script.js"></script><script src="dashboard.js"></script></body></html>
