<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apna Test Banao - Math Guru</title>

  <style>
    :root {
      --primary: #0056b3;
      --text-main: #333;
      --card-bg: #ffffff;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      color: var(--text-main);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    h2 {
      color: var(--primary);
      text-align: center;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    select,
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    select:focus,
    input:focus {
      border-color: var(--primary);
      outline: none;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      padding: 14px 20px;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: 0.3s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      box-sizing: border-box;
    }

    .btn:hover {
      background-color: #004085;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .notice {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      font-weight: 600;
    }

    .notice.notice {
      background: #e3f2fd;
      color: #0d47a1;
    }

    .notice.success {
      background: #e8f5e9;
      color: #1b5e20;
    }

    .notice.error {
      background: #ffebee;
      color: #b71c1c;
    }

    #test-status-bar {
      display: none;
      justify-content: space-between;
      background: #e3f2fd;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: bold;
      font-size: 18px;
      color: var(--primary);
      gap: 10px;
      flex-wrap: wrap;
    }

    .question-card {
      background: #f8f9fa;
      border-left: 5px solid var(--primary);
      padding: 20px;
      margin-bottom: 25px;
      border-radius: 0 8px 8px 0;
    }

    .options-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
      margin-bottom: 15px;
    }

    .option-btn {
      background: white;
      border: 2px solid #dee2e6;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
      font-size: 15px;
      transition: 0.2s;
    }

    .option-btn:hover {
      border-color: var(--primary);
      background: #f0f4f8;
    }

    .option-btn.selected {
      background: #d1ecf1;
      border-color: #0c5460;
    }

    .action-btns {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-secondary {
      background: #6c757d;
      color: white;
      padding: 8px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .solution-box {
      background: #fff3cd;
      border: 1px solid #ffeeba;
      padding: 15px;
      margin-top: 10px;
      border-radius: 6px;
      display: none;
      color: #856404;
      white-space: pre-wrap;
    }

    .q-type-badge {
      display: inline-block;
      background: #e2e8f0;
      color: #4a5568;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .top-links {
      max-width: 800px;
      margin: 0 auto 15px auto;
      display: flex;
      gap: 10px;
    }

    .top-links a {
      color: #0056b3;
      text-decoration: none;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      .options-container {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="top-links">
    <a href="dashboard.html">← Dashboard</a>
    <a href="ask-doubt.html">Ask Doubt</a>
  </div>

  <div class="container">
    <h2>📝 Apna Test Banao</h2>
    <p style="text-align:center; color:#666; margin-top:-15px;">
      Class, Chapter aur Difficulty chuno — apna Maths Test turant banao.
    </p>

    <div id="setup-container">
      <div class="form-group">
        <label>Select Class</label>
        <select id="classLevel">
          <option value="1">Class 1</option>
          <option value="2">Class 2</option>
          <option value="3">Class 3</option>
          <option value="4">Class 4</option>
          <option value="5">Class 5</option>
          <option value="6">Class 6</option>
          <option value="7">Class 7</option>
          <option value="8">Class 8</option>
          <option value="9">Class 9</option>
          <option value="10" selected>Class 10</option>
          <option value="11">Class 11</option>
          <option value="12">Class 12</option>
        </select>
      </div>

      <div class="form-group">
        <label>Chapter Name</label>
        <input type="text" id="chapter" placeholder="e.g., Polynomials, Trigonometry" required>
      </div>

      <div class="form-group">
        <label>Difficulty</label>
        <select id="difficulty">
          <option value="Easy">Easy</option>
          <option value="Medium" selected>Medium</option>
          <option value="Hard">Hard</option>
        </select>
      </div>

      <div class="form-group">
        <label>Question Type</label>
        <select id="questionType">
          <option value="MCQ">MCQ</option>
          <option value="Very Short">Very Short Question</option>
          <option value="Short">Short Question</option>
          <option value="Long">Long Question</option>
          <option value="Mixed" selected>Mixed Questions</option>
        </select>
      </div>

      <div class="form-group">
        <label>Number of Questions</label>
        <select id="numQuestions">
          <option value="5" selected>5 Questions</option>
          <option value="10">10 Questions</option>
          <option value="20">20 Questions</option>
        </select>
      </div>

      <div class="form-group">
        <label>Language</label>
        <select id="language">
          <option value="Hinglish" selected>Hinglish</option>
          <option value="English">English</option>
          <option value="Hindi">Hindi</option>
        </select>
      </div>

      <button class="btn" id="generate-btn" type="button">⚡ Test Generate Karo</button>

      <div id="testMsg" class="notice"></div>
    </div>

    <div id="test-container" style="display:none;">
      <div id="test-status-bar">
        <div id="running-chapter">Chapter:</div>
        <div id="timer">⏰ Time: 00:00</div>
      </div>

      <div id="questions-area"></div>

      <button class="btn" id="submit-test-btn" type="button" style="background:#28a745; margin-top:20px;">
        🎯 Test Submit Karo
      </button>
    </div>
  </div>

  <script src="script.js"></script>

  <script>
    let activeTestId = "";
    let testQuestions = [];
    let timerInterval = null;
    let secondsElapsed = 0;
    const userSelections = {};

    function showTestMsg(text, type = "notice") {
      const box = document.querySelector("#testMsg");
      if (!box) return;

      box.className = `notice ${type}`;
      box.textContent = text;
      box.style.display = "block";
    }

    function safeText(value) {
      return String(value || "").replace(/[<>&]/g, "");
    }

    async function startTestGeneration() {
      const token = localStorage.getItem("mg_token");

      if (!token) {
        alert("Pehle login karo.");
        window.location.href = "login.html";
        return;
      }

      const btn = document.querySelector("#generate-btn");

      const classLevel = document.querySelector("#classLevel").value;
      const chapter = document.querySelector("#chapter").value.trim();
      const difficulty = document.querySelector("#difficulty").value;
      const questionType = document.querySelector("#questionType").value;
      const numQuestions = document.querySelector("#numQuestions").value;
      const language = document.querySelector("#language").value;

      if (!chapter) {
        showTestMsg("Chapter/topic enter karo.", "error");
        return;
      }

      const payload = {
        classLevel,
        subject: "Mathematics",
        chapter,
        difficulty,
        questionType,
        numQuestions,
        language
      };

      try {
        btn.disabled = true;
        btn.textContent = "🔄 AI Test ban raha hai...";
        showTestMsg("AI test generate kar raha hai. Please wait...", "notice");

        let data;

        if (typeof request === "function") {
          data = await request("/api/test/generate", {
            method: "POST",
            body: JSON.stringify(payload)
          });
        } else {
          const API_BASE =
            window.location.hostname === "localhost" ||
            window.location.hostname === "127.0.0.1"
              ? "http://localhost:3000/api"
              : "https://math-guru.onrender.com/api";

          const res = await fetch(`${API_BASE}/test/generate`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify(payload)
          });

          data = await res.json();
          if (!res.ok) throw new Error(data.message || "Test generation failed");
        }

        activeTestId = data.testId;
        testQuestions = Array.isArray(data.questions) ? data.questions : [];

        if (testQuestions.length === 0) {
          throw new Error("AI ne questions return nahi kiye.");
        }

        document.querySelector("#setup-container").style.display = "none";
        document.querySelector("#test-container").style.display = "block";
        document.querySelector("#test-status-bar").style.display = "flex";
        document.querySelector("#running-chapter").textContent = `Chapter: ${chapter}`;

        renderQuestions();
        startTimer();

      } catch (err) {
        showTestMsg(err.message, "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "⚡ Test Generate Karo";
      }
    }

    function startTimer() {
      secondsElapsed = 0;

      if (timerInterval) clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        secondsElapsed++;

        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, "0");
        const secs = String(secondsElapsed % 60).padStart(2, "0");

        document.querySelector("#timer").textContent = `⏰ Time: ${mins}:${secs}`;
      }, 1000);
    }

    function renderQuestions() {
      const area = document.querySelector("#questions-area");
      area.innerHTML = "";

      testQuestions.forEach((q, idx) => {
        userSelections[idx] = null;

        const card = document.createElement("div");
        card.className = "question-card";

        const qType = q.type || document.querySelector("#questionType").value;

        let optionsHTML = "";

        if (Array.isArray(q.options) && q.options.length > 0) {
          optionsHTML = `
            <div class="options-container">
              ${q.options.map((opt, oIdx) => `
                <button
                  type="button"
                  class="option-btn"
                  id="opt-${idx}-${oIdx}"
                  onclick="selectOption(${idx}, ${oIdx}, ${JSON.stringify(opt)})"
                >
                  ${safeText(opt)}
                </button>
              `).join("")}
            </div>
          `;
        } else {
          optionsHTML = `
            <p style="color:#718096; font-size:14px; margin-top:10px;">
              ✍️ Is sawal ko notebook par solve karein, fir answer match karein.
            </p>
          `;
        }

        card.innerHTML = `
          <span class="q-type-badge">${safeText(qType)}</span><br>

          <strong>Q${idx + 1}: ${safeText(q.question)}</strong>

          ${optionsHTML}

          <div class="action-btns">
            <button type="button" class="btn-secondary" onclick="toggleSolution(${idx})">
              💡 Step-by-Step Solution
            </button>
          </div>

          <div class="solution-box" id="sol-${idx}">
            <strong>Correct Answer / Final Output:</strong>
            ${safeText(q.correctAnswer)}<br><br>

            <strong>Solution Steps:</strong>
            <div style="white-space:pre-wrap;">
              ${safeText(q.stepByStepSolution)}
            </div>
          </div>
        `;

        area.appendChild(card);
      });
    }

    function selectOption(qIdx, oIdx, selectedValue) {
      const selectedBtn = document.querySelector(`#opt-${qIdx}-${oIdx}`);
      if (!selectedBtn) return;

      const siblings = selectedBtn.parentNode.children;

      for (let btn of siblings) {
        btn.classList.remove("selected");
      }

      selectedBtn.classList.add("selected");
      userSelections[qIdx] = selectedValue;
    }

    function toggleSolution(idx) {
      const box = document.querySelector(`#sol-${idx}`);
      if (!box) return;

      box.style.display = box.style.display === "block" ? "none" : "block";
    }

    async function submitFinalTest() {
      if (timerInterval) clearInterval(timerInterval);

      let finalScore = 0;
      let mcqCount = 0;

      testQuestions.forEach((q, idx) => {
        if (Array.isArray(q.options) && q.options.length > 0) {
          mcqCount++;

          const selected = String(userSelections[idx] || "").trim();
          const correct = String(q.correctAnswer || "").trim();

          if (selected && selected === correct) {
            finalScore++;
          }
        }
      });

      const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, "0");
      const secs = String(secondsElapsed % 60).padStart(2, "0");
      const finalTimeStr = `${mins}:${secs}`;

      try {
        if (activeTestId) {
          if (typeof request === "function") {
            await request(`/api/test/submit/${activeTestId}`, {
              method: "POST",
              body: JSON.stringify({
                score: finalScore,
                timeTaken: finalTimeStr
              })
            });
          } else {
            const token = localStorage.getItem("mg_token");

            const API_BASE =
              window.location.hostname === "localhost" ||
              window.location.hostname === "127.0.0.1"
                ? "http://localhost:3000/api"
                : "https://math-guru.onrender.com/api";

            await fetch(`${API_BASE}/test/submit/${activeTestId}`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
              },
              body: JSON.stringify({
                score: finalScore,
                timeTaken: finalTimeStr
              })
            });
          }
        }

        if (mcqCount > 0) {
          alert(`🎉 Test Completed!\nMCQ Score: ${finalScore} / ${mcqCount}\nTime Taken: ${finalTimeStr}`);
        } else {
          alert(`🎉 Test Completed!\nTime Taken: ${finalTimeStr}\nSolutions check karo.`);
        }

        testQuestions.forEach((_, idx) => {
          const sol = document.querySelector(`#sol-${idx}`);
          if (sol) sol.style.display = "block";
        });

      } catch (err) {
        alert("Score saving error: " + err.message);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const generateBtn = document.querySelector("#generate-btn");
      const submitBtn = document.querySelector("#submit-test-btn");

      if (generateBtn) {
        generateBtn.addEventListener("click", startTestGeneration);
      }

      if (submitBtn) {
        submitBtn.addEventListener("click", submitFinalTest);
      }
    });
  </script>

</body>
</html>
