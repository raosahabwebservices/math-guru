<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apna Test Banao - Math Guru</title>
    <style>
        :root {
            --primary: #0056b3;
            --bg-dark: #0a192f;
            --text-main: #333;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: var(--text-main);
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 { color: var(--primary); text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; }
        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        select:focus, input:focus { border-color: var(--primary); outline: none; }
        .btn {
            background-color: var(--primary);
            color: white;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .btn:hover { background-color: #004085; }
        
        /* ⏰ TIMER & SCORE BANNER */
        #test-status-bar {
            display: flex;
            justify-content: space-between;
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 18px;
            color: var(--primary);
            display: none;
        }

        /* 📝 QUESTION CARD LAYOUT */
        .question-card {
            background: #f8f9fa;
            border-left: 5px solid var(--primary);
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 0 8px 8px 0;
        }
        .options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }
        .option-btn {
            background: white;
            border: 2px solid #dee2e6;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 15px;
            transition: 0.2s;
        }
        .option-btn:hover { border-color: var(--primary); background: #f0f4f8; }
        .option-btn.selected { background: #d1ecf1; border-color: #0c5460; }
        
        .action-btns {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .solution-box {
            background: #fff3cd;
            border: 1px solid #ffeeba;
            padding: 15px;
            margin-top: 10px;
            border-radius: 6px;
            display: none;
            color: #856404;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 Apna Test Banao</h2>
    <p style="text-align:center; color:#666; margin-top:-15px;">Class, Chapter aur Difficulty chuno — apna Maths Test turant banao.</p>

    <div id="setup-container">
        <div class="form-group">
            <label>Select Class</label>
            <select id="classLevel">
                <option value="10">Class 10</option>
                <option value="12">Class 12</option>
                <option value="9">Class 9</option>
                <option value="11">Class 11</option>
                </select>
        </div>
        <div class="form-group">
            <label>Chapter Name</label>
            <input type="text" id="chapter" placeholder="e.g., Polynomials, Trigonometry" required>
        </div>
        <div class="form-group">
            <label>Difficulty</label>
            <select id="difficulty">
                <option value="Easy">Easy</option>
                <option value="Medium">Medium</option>
                <option value="Hard">Hard</option>
            </select>
        </div>
        <div class="form-group">
            <label>Question Type</label>
            <select id="questionType">
                <option value="MCQ">MCQ (Multiple Choice)</option>
                <option value="Mixed">Mixed Questions</option>
            </select>
        </div>
        <div class="form-group">
            <label>Number of Questions</label>
            <select id="numQuestions">
                <option value="5">5 Questions</option>
                <option value="10">10 Questions</option>
                <option value="20">20 Questions</option>
            </select>
        </div>
        <div class="form-group">
            <label>Language</label>
            <select id="language">
                <option value="Hinglish">Hinglish (Hindi + English)</option>
                <option value="English">English</option>
                <option value="Hindi">Hindi</option>
            </select>
        </div>
        <button class="btn" id="generate-btn" onclick="startTestGeneration()">⚡ Test Generate Karo</button>
    </div>

    <div id="test-container" style="display: none;">
        <div id="test-status-bar">
            <div id="running-chapter">Chapter: </div>
            <div id="timer">⏰ Time: 00:00</div>
        </div>
        
        <div id="questions-area"></div>
        
        <button class="btn" style="background:#28a745; margin-top:20px;" onclick="submitFinalTest()">🎯 Test Submit Karo</button>
    </div>
</div>

<script>
    let activeTestId = "";
    let testQuestions = [];
    let timerInterval;
    let secondsElapsed = 0;
    const userSelections = {};

    // API Backend url configurations (Render app se direct linked)
    const API_BASE = "https://math-guru.onrender.com/api"; 

    // 1. BACKEND SE TEST GENERATE KARWANA
    async function startTestGeneration() {
        const token = localStorage.getItem("token"); // Auth verification check
        if (!token) { alert("Pehle login karo bhai!"); window.location.href = "login.html"; return; }

        document.getElementById("generate-btn").innerText = "🔄 AI Test Ban raha hai, please wait...";
        document.getElementById("generate-btn").disabled = true;

        const payload = {
            classLevel: document.getElementById("classLevel").value,
            chapter: document.getElementById("chapter").value,
            difficulty: document.getElementById("difficulty").value,
            questionType: document.getElementById("questionType").value,
            numQuestions: document.getElementById("numQuestions").value,
            language: document.getElementById("language").value
        };

        try {
            const res = await fetch(`${API_BASE}/test/generate`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            
            if (!res.ok) throw new Error(data.message || "Failed to compile");

            activeTestId = data.testId;
            testQuestions = data.questions;

            // UI transitions swapping
            document.getElementById("setup-container").style.display = "none";
            document.getElementById("test-container").style.display = "block";
            document.getElementById("test-status-bar").style.display = "flex";
            document.getElementById("running-chapter").innerText = `Chapter: ${payload.chapter}`;

            renderQuestions();
            startTimer();

        } catch (err) {
            alert("Error: " + err.message);
            document.getElementById("generate-btn").innerText = "⚡ Test Generate Karo";
            document.getElementById("generate-btn").disabled = false;
        }
    }

    // 2. LIVE TIMER REFRESHER LOGIC
    function startTimer() {
        secondsElapsed = 0;
        timerInterval = setInterval(() => {
            secondsElapsed++;
            const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            const secs = String(secondsElapsed % 60).padStart(2, '0');
            document.getElementById("timer").innerText = `⏰ Time: ${mins}:${secs}`;
        }, 1000);
    }

    // 3. RENDER QUESTIONS DYNAMICALLY ON PAGE
    function renderQuestions() {
        const area = document.getElementById("questions-area");
        area.innerHTML = "";

        testQuestions.forEach((q, idx) => {
            userSelections[idx] = null; // Reset choices array
            
            const card = document.createElement("div");
            card.className = "question-card";
            
            let optionsHTML = "";
            if (q.options && q.options.length > 0) {
                optionsHTML = `<div class="options-container">
                    ${q.options.map((opt, oIdx) => `
                        <button class="option-btn" id="opt-${idx}-${oIdx}" onclick="selectOption(${idx}, ${oIdx}, '${opt}')">
                            ${opt}
                        </button>
                    `).join('')}
                </div>`;
            }

            card.innerHTML = `
                <strong>Q${idx + 1}: ${q.question}</strong>
                ${optionsHTML}
                <div class="action-btns">
                    <button class="btn-secondary" onclick="toggleSolution(${idx})">💡 Step-by-Step Solution</button>
                </div>
                <div class="solution-box" id="sol-${idx}">
                    <strong>Correct Answer:</strong> ${q.correctAnswer}<br><br>
                    <strong>Solution Steps:</strong> ${q.stepByStepSolution}
                </div>
            `;
            area.appendChild(card);
        });
    }

    // Option selecting highlighter logic
    function selectOption(qIdx, oIdx, selectedValue) {
        // Purane highlighted selectors ko remove karo list se
        const siblings = document.getElementById(`opt-${qIdx}-${oIdx}`).parentNode.children;
        for (let btn of siblings) btn.classList.remove("selected");

        // Naye option ko highligher active karo
        document.getElementById(`opt-${qIdx}-${oIdx}`).classList.add("selected");
        userSelections[qIdx] = selectedValue;
    }

    // Accordion expand/collapse hide toggle solution boxes
    function toggleSolution(idx) {
        const box = document.getElementById(`sol-${idx}`);
        box.style.display = box.style.display === "block" ? "none" : "block";
    }

    // 4. SUBMIT AND TRANSMIT SCORES RECORD TO SERVER
    async function submitFinalTest() {
        clearInterval(timerInterval); // Stop timer clock tracking
        
        let finalScore = 0;
        testQuestions.forEach((q, idx) => {
            if (userSelections[idx] && userSelections[idx].trim() === q.correctAnswer.trim()) {
                finalScore++;
            }
        });

        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        const finalTimeStr = `${mins}:${secs}`;

        const token = localStorage.getItem("token");
        try {
            await fetch(`${API_BASE}/test/submit/${activeTestId}`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({ score: finalScore, timeTaken: finalTimeStr })
            });

            // Show final output screen popup box report
            alert(`🎉 Test Completed!\nScore: ${finalScore} / ${testQuestions.length}\nTime Taken: ${finalTimeStr}\n\nAb aap niche 'Step-by-Step Solution' dabakar saare answers check kar sakte hain.`);
            
            // Auto open up all solutions layout boxes for review process
            testQuestions.forEach((_, idx) => {
                document.getElementById(`sol-${idx}`).style.display = "block";
            });

        } catch (err) {
            alert("Score saving network error: " + err.message);
        }
    }
</script>
</body>
  </html>
