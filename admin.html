<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin | MATHS GURU</title><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><link rel="stylesheet" href="style.css"></head><body><nav class="nav"><div class="nav-inner"><a class="brand" href="index.html">MATHS GURU Admin</a><div class="links"><button id="adminLogout" class="btn small ghost">Logout</button></div></div></nav><main class="container"><section id="adminLogin" class="grid two"><div><h1 class="section-title">Secure Admin Login</h1><p class="muted">Default credentials come from .env.example and are seeded locally on first start.</p></div><form id="adminLoginForm" class="card form full"><div><label class="label">Admin Email</label><input name="email" type="email" required value="admin@mathsguru.local"></div><div><label class="label">Password</label><input name="password" type="password" required placeholder="Admin@12345"></div><button class="btn" type="submit">Login</button><div id="adminLoginMsg" class="hidden"></div></form></section><section id="adminPanel" class="hidden"><h1 class="section-title">Admin Dashboard</h1><div class="grid" id="adminStats"></div><section style="margin-top:28px"><h2>Pending Payments</h2><div class="table-wrap"><table><thead><tr><th>User</th><th>UTR</th><th>Status</th><th>Screenshot</th><th>Action</th></tr></thead><tbody id="paymentsTable"></tbody></table></div></section><section style="margin-top:28px"><h2>Users</h2><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Plan</th><th>Usage</th><th>Action</th></tr></thead><tbody id="usersTable"></tbody></table></div></section><section style="margin-top:28px"><h2>Recent Doubts</h2><div id="adminDoubts" class="card"></div></section><section style="margin-top:28px"><h2>Contact Messages</h2><div id="contactsList" class="card"></div></section></section></main><script src="script.js"></script><script src="admin.js"></script></body></html>
