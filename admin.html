<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | MATHS GURU</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <a class="brand" href="index.html">MATHS GURU Admin</a>
            <div class="links">
                <button id="adminLogout" class="btn small ghost">Logout</button>
            </div>
        </div>
    </nav>

    <main class="container">
        <section id="adminLogin" class="grid two">
            <div>
                <h1 class="section-title">Secure Admin Login</h1>
                <p class="muted">Enter your admin credentials to manage users, payments, and AI doubts.</p>
            </div>
            <form id="adminLoginForm" class="card">
                <div style="margin-bottom: 15px;">
                    <label style="display:block; margin-bottom:5px; font-weight:bold;">Admin Email</label>
                    <input name="email" type="email" required placeholder="admin@mathsguru.com">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display:block; margin-bottom:5px; font-weight:bold;">Password</label>
                    <input name="password" type="password" required placeholder="••••••••">
                </div>
                <button class="btn" type="submit" style="width:100%">Login to Dashboard</button>
                <div id="adminLoginMsg" class="hidden" style="margin-top:15px;"></div>
            </form>
        </section>

        <section id="adminPanel" class="hidden">
            <h1 class="section-title">Admin Dashboard</h1>
            
            <div class="grid" id="adminStats" style="margin-bottom: 30px;">
                </div>

            <div class="card" style="margin-top:28px">
                <h2 style="margin-bottom:15px">Pending Payments</h2>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>UTR Number</th>
                                <th>Status</th>
                                <th>Screenshot</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="paymentsTable">
                            </tbody>
                    </table>
                </div>
            </div>

            <div class="card" style="margin-top:28px">
                <h2 style="margin-bottom:15px">Registered Users</h2>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Plan</th>
                                <th>Usage (T/I)</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="usersTable">
                            </tbody>
                    </table>
                </div>
            </div>

            <div style="margin-top:28px">
                <h2 style="margin-bottom:15px">Recent Doubts</h2>
                <div id="adminDoubts">
                    </div>
            </div>

            <div style="margin-top:28px">
                <h2 style="margin-bottom:15px">Contact Messages</h2>
                <div id="contactsList">
                    </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
    <script src="admin.js"></script>
</body>
</html>
