<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MATHS GURU</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <a class="brand" href="index.html">MATHS GURU</a>
            <div class="links">
                <a href="signup.html">Signup</a>
                <a href="contact.html">Contact</a>
            </div>
        </div>
    </nav>
    <main class="container">
        <div class="grid two">
            <section><h1 class="section-title">Login</h1><p class="muted">Continue your maths learning journey.</p></section>
            <section class="card">
                <form id="loginForm" class="form">
                    <div>
                        <label class="label">Email or Mobile Number</label>
                        <input name="identifier" type="text" placeholder="Enter Email or Mobile" required>
                    </div>
                    <div>
                        <label class="label">Password</label>
                        <input name="password" type="password" placeholder="Enter Password" required>
                    </div>
                    <button class="btn" type="submit">Login</button>
                    <p>New student? <a class="brand" href="signup.html">Create account</a></p>
                    <div id="formMsg" class="hidden"></div>
                </form>
            </section>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
